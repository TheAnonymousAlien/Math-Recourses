<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Científica - Herramientas de Clase</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 40px; margin: 0; }
        .calc-container { background: #333; padding: 20px; border-radius: 12px; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); width: 260px; z-index: 10; }
        #display { width: 100%; height: 50px; background: #a4b0be; border: none; border-radius: 6px; font-size: 24px; text-align: right; padding: 5px 10px; box-sizing: border-box; margin-bottom: 15px; font-family: monospace; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        button { width: 55px; height: 55px; border-radius: 6px; border: none; font-size: 18px; cursor: pointer; font-weight: bold; background: #f1f2f6; }
        button.op { background: #ffa502; color: white; }
        button.eq { background: #2ed573; color: white; width: 120px; }
        #secret-menu { display: none; width: 90%; max-width: 1000px; margin-top: 20px; background: #131419; padding: 25px; border-radius: 16px; color: white; text-align: center; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
        #buscador-juegos { width: 85%; max-width: 450px; padding: 12px 16px; margin-top: 10px; border-radius: 10px; border: 2px solid #2f313d; background: #1f2029; color: white; font-size: 14px; outline: none; }
        #buscador-juegos:focus { border-color: #1e90ff; }
        #contador-juegos { font-size: 13px; color: #a4b0be; margin-top: 8px; }
        .grid-juegos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin-top: 20px; max-height: 60vh; overflow-y: auto; padding: 10px; }
        .tarjeta-juego { background: #1f2029; border-radius: 12px; padding: 10px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; border: 2px solid #2f313d; text-align: center; }
        .tarjeta-juego:hover { transform: translateY(-4px); border-color: #1e90ff; }
        .tarjeta-portada { width: 100%; height: 95px; border-radius: 8px; background: #131419; display: flex; align-items: center; justify-content: center; font-size: 36px; }
        .tarjeta-juego span { display: block; font-size: 13px; margin-top: 10px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #panic-btn { position: fixed; top: 15px; right: 15px; z-index: 10000; padding: 10px 20px; background: #ff4757; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #panic-btn:hover { background: #ff6b81; }
    </style>
</head>
<body>
    <button id="panic-btn" onclick="botonPanico()">CERRAR VISTA (ESC)</button>
    <div class="calc-container">
        <input type="text" id="display" readonly value="0">
        <div class="row">
            <button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button class="op" onclick="press('/')">/</button>
        </div>
        <div class="row">
            <button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button class="op" onclick="press('*')">*</button>
        </div>
        <div class="row">
            <button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button class="op" onclick="press('-')">-</button>
        </div>
        <div class="row">
            <button onclick="clearCalc()">C</button><button onclick="press('0')">0</button><button class="eq" onclick="calculate()">=</button>
        </div>
    </div>
    <div id="secret-menu">
        <h2>🎮 CrazyMath Arcade Premium v4.0</h2>
        <p>Catálogo local optimizado. Historial blindado en servidores Netlify.</p>
        <input type="text" id="buscador-juegos" placeholder="🔍 Buscar entre los 352 juegos..." oninput="filtrarJuegos()">
        <div id="contador-juegos">Cargando biblioteca completa...</div>
        <div class="grid-juegos" id="contenedor-juegos"></div>
    </div>
    <script>
        let currentInput = "";
        let contenedorIframeGlobal = null;
        let misJuegos = [];
        let catalogoCargado = false;

        function press(num) {
            const disp = document.getElementById("display").value;
            if (disp === "0" || disp === "ACTIVATED" || disp === "Error") currentInput = "";
            currentInput += num;
            document.getElementById("display").value = currentInput;
        }
        
        function clearCalc() { currentInput = ""; document.getElementById("display").value = "0"; }

        function formatearNombre(archivo) {
            return archivo.replace(/\.html$/i, "").replace(/[-_]/g, " ").replace(/\b\w/g, l => l.toUpperCase());
        }

        function pintarTarjetas(lista) {
            const contenedor = document.getElementById("contenedor-juegos");
            contenedor.innerHTML = "";
            lista.forEach(juego => {
                let tarjeta = document.createElement("div");
                tarjeta.className = "tarjeta-juego";
                tarjeta.innerHTML = `<div class="tarjeta-portada">🕹️</div><span title="${juego.name}">${juego.name}</span>`;
                tarjeta.onclick = () => arrancarIframeOculto(juego.url);
                contenedor.appendChild(tarjeta);
            });
        }
        
        async function construirCatalogoLocal() {
            if (catalogoCargado) { pintarTarjetas(misJuegos); return; }
            const contador = document.getElementById("contador-juegos");
            try {
                const res = await fetch("https://github.com");
                const datos = await res.json();
                misJuegos = datos.tree
                    .filter(item => item.path.startsWith("offline/") && item.path.endsWith(".html"))
                    .map(item => ({ name: formatearNombre(item.path.replace("offline/", "")), url: item.path }))
                    .sort((a, b) => a.name.localeCompare(b.name));
                catalogoCargado = true;
                contador.textContent = misJuegos.length + " juegos disponibles en servidor local";
                pintarTarjetas(misJuegos);
            } catch (e) {
                contador.textContent = "Error al cargar la lista de juegos";
            }
        }

        function filtrarJuegos() {
            const texto = document.getElementById("buscador-juegos").value.toLowerCase();
            const filtrados = misJuegos.filter(j => j.name.toLowerCase().includes(texto));
            document.getElementById("contador-juegos").textContent = "Mostrando " + filtrados.length + " de " + misJuegos.length + " juegos";
            pintarTarjetas(filtrados);
        }

        function arrancarIframeOculto(urlFiltrada) {
            document.querySelector(".calc-container").style.display = "none";
            document.getElementById("secret-menu").style.display = "none";
            document.getElementById("panic-btn").style.display = "block";
            contenedorIframeGlobal = document.createElement("div");
            contenedorIframeGlobal.style.position = "fixed";
            contenedorIframeGlobal.style.top = "0"; contenedorIframeGlobal.style.left = "0";
            contenedorIframeGlobal.style.width = "100vw"; contenedorIframeGlobal.style.height = "100vh";
            contenedorIframeGlobal.style.backgroundColor = "#000"; contenedorIframeGlobal.style.zIndex = "9999";
            let iframe = document.createElement("iframe");
            iframe.src = urlFiltrada;
            iframe.style.width = "100%"; iframe.style.height = "100%"; iframe.style.border = "none";
            contenedorIframeGlobal.appendChild(iframe);
            document.body.appendChild(contenedorIframeGlobal);
        }

        function botonPanico() {
            if (contenedorIframeGlobal) { contenedorIframeGlobal.remove(); contenedorIframeGlobal = null; }
            document.getElementById("panic-btn").style.display = "none";
            document.querySelector(".calc-container").style.display = "block";
            document.getElementById("secret-menu").style.display = "none";
            clearCalc();
        }

        window.addEventListener("keydown", (e) => { if (e.key === "Escape") botonPanico(); });

        function calculate() {
            if (currentInput.includes("-")) {
                let partes = currentInput.split("-");
                let bloqueInicial = partes.at(0);
                let digitoVerificador = partes.at(1);
                if (bloqueInicial && digitoVerificador && bloqueInicial.length === 3 && digitoVerificador.length === 1) {
                    let suma = parseInt(bloqueInicial.charAt(0)) + parseInt(bloqueInicial.charAt(1)) + parseInt(bloqueInicial.charAt(2));
                    if (suma.toString() === digitoVerificador) {
                        document.getElementById("secret-menu").style.display = "block";
                        construirCatalogoLocal();
                        clearCalc();
                        document.getElementById("display").value = "ACTIVATED";
                        return;
                    }
                }
            }
            try {
                let result = eval(currentInput); document.getElementById("display").value = result; currentInput = result.toString();
            } catch (e) { document.getElementById("display").value = "Error"; currentInput = ""; }
        }
    </script>
</body>
</html>
